<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ShadowDraw — Magic Hands Studio</title>
<meta name="description" content="Draw, colour, learn and make music by moving your hands in front of the webcam. Free, works offline. By Shadow Creative Studio.">
<!-- Link previews (LinkedIn, WhatsApp, Facebook, X) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="ShadowDraw">
<meta property="og:title" content="ShadowDraw — Magic Hands Studio">
<meta property="og:description" content="Draw, colour, learn and make music with just your hands and a webcam. Free, works offline on web and Windows.">
<meta property="og:url" content="https://shadowdraw.vercel.app/">
<meta property="og:image" content="https://shadowdraw.vercel.app/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="ShadowDraw app with a glowing kaleidoscope drawing">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="ShadowDraw — Magic Hands Studio">
<meta name="twitter:description" content="Draw, colour, learn and make music with just your hands and a webcam.">
<meta name="twitter:image" content="https://shadowdraw.vercel.app/og-image.png">
<meta name="theme-color" content="#0b1030">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ShadowDraw">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Stage layers -->
  <div id="stage">
    <canvas id="bg"></canvas>
    <div id="layers"></div>
    <canvas id="fx"></canvas>
  </div>

  <!-- UI -->
  <div id="ui">
    <header id="topbar">
      <button class="hit iconbtn" id="btnHome" title="Home" aria-label="Home"><span>⌂</span></button>
      <div id="modeTitle">ShadowDraw</div>
      <div id="modeTools"></div>
      <div class="spacer"></div>
      <div id="trackStatus" class="pill" title="Hand tracking status">✋ …</div>
    </header>
    <div id="sideTools"></div>
    <div id="bottomTools"></div>
    <div id="screens"></div>
  </div>

  <canvas id="cursors"></canvas>
  <div id="praise"></div>
  <div id="toast"></div>
  <div id="modal" hidden></div>

  <video id="video" playsinline muted autoplay></video>

  <script src="vendor/mediapipe-hands/hands.js"></script>
  <script src="js/util.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/tracker.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/store.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/modes/draw.js"></script>
  <script src="js/modes/color.js"></script>
  <script src="js/modes/trace.js"></script>
  <script src="js/modes/games.js"></script>
  <script src="js/modes/music.js"></script>
  <script src="js/modes/stickers.js"></script>
  <script src="js/modes/gallery.js"></script>
  <script src="js/modes/parents.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
